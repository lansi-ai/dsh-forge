# macOS 发布工作流：GitHub Actions macos runner 构建 dmg + zip（arm64/x64 双架构），
# 经 electron-builder --publish always 直接上传到 package.json version 对应的 v{version} Release。
# 触发：**仅 workflow_dispatch**（2026-09-15 按坑 70 决策 B2 移除 `push: tags`）。
# 原因：`gh release create --target main` 会在远端隐式建 tag，而单个 tag 创建会发 push 事件 →
# 本 workflow 会立刻重建并用 `--clobber` 覆盖 `--publish-local` 的本地产物（rc.5 实测）。
# 移除后：Windows 以本地产物为准；**mac 产物需为每个版本手动 Run workflow 一次**（检出 main 最新
# 代码构建，本机 Windows 无法本地打 dmg）。
name: release-mac

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-mac
  cancel-in-progress: false

jobs:
  build-mac:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache electron binaries
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & lint
        run: |
          npm run typecheck
          npm run lint

      - name: Build
        run: npm run build

      - name: Package (dmg + zip, arm64/x64)
        run: npx electron-builder --mac --publish never

      - name: Get version
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Ensure release exists (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          PRERELEASE=""
          if echo "$TAG" | grep -Eq -- '-[a-zA-Z]+\.'; then PRERELEASE="--prerelease"; fi
          gh release create "$TAG" --title "$TAG" \
            --notes "Created automatically by release-mac workflow." \
            $PRERELEASE --repo "$GITHUB_REPOSITORY" 2>/dev/null || true

      - name: Upload mac artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release upload "$TAG" \
            release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml \
            --clobber --repo "$GITHUB_REPOSITORY"

      - name: Align artifact names to latest-mac.yml path (坑 41)
        run: node scripts/align-release-assets.cjs

      - name: Generate SHA256SUMS-mac
        run: |
          cd release
          shasum -a 256 *.dmg *.zip > SHA256SUMS-mac
          cat SHA256SUMS-mac

      - name: Upload checksums to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          gh release upload "$TAG" release/SHA256SUMS-mac --clobber --repo "$GITHUB_REPOSITORY"
